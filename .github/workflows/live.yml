name: Live-testit

# Runs the tools against the real Hiski every week, so that changes in
# Hiski's pages are noticed before users run into them.
on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:live

      - name: Ilmoita epäonnistumisesta issuella
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ajo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create live-testit --color B60205 --description "Ajastetut live-testit" --force
          avoin="$(gh issue list --label live-testit --state open --json number --jq '.[0].number')"
          if [ -n "$avoin" ]; then
            gh issue comment "$avoin" --body "Live-testit epäonnistuivat taas: $ajo"
          else
            gh issue create --title "Live-testit epäonnistuivat" --label live-testit --body "Ajastetut live-testit epäonnistuivat: $ajo

          Hiskin sivut ovat voineet muuttua. Katso ajon loki; tarvittaessa \`npm run tallenna-fixturet\` tai \`npm run paivita-seurakunnat\` ja parserin korjaus (ks. test/live/)."
          fi
