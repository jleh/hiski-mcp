name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  paketti:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run
      - run: npm run paketoi
      - name: Testaa paketti Node 24:llä
        run: npm run testaa-paketti
      # The manifest allows Node 20.3, so the bundled server must run on it.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Testaa paketti Node 20:llä
        run: npm run testaa-paketti
      - uses: actions/upload-artifact@v7
        with:
          name: hiski-mcp-mcpb
          path: hiski-mcp.mcpb
          if-no-files-found: error
